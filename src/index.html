<style>
:root{
  --brand:#0f3d56; --brand2:#16618a; --accent:#e8892b; --bg:#f4f6f8; --card:#fff; --ink:#1d2730; --muted:#66727e;
  --line:#dde3e8; --soft:#eef3f7; --ok:#1f8a4c; --warn:#c77700; --bad:#c0392b; --r:12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
#app{display:flex;min-height:100%}
/* sidebar (desktop) */
#side{width:232px;background:var(--brand);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
#side .logo{padding:20px 18px 14px;display:flex;gap:10px;align-items:center}
#side .logo .mark{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px}
#side .logo b{display:block;font-size:15px;letter-spacing:.2px}
#side .logo span{font-size:11px;opacity:.7}
#side nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#d7e6ef;text-decoration:none;border-left:3px solid transparent}
#side nav a.on{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--accent)}
#side nav a:hover{background:rgba(255,255,255,.06)}
#side .foot{margin-top:auto;padding:14px 18px;font-size:12px;opacity:.85}
.ico{width:18px;height:18px;flex-shrink:0}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
#top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-size:12px;color:var(--muted);font-weight:400}
#back{display:inline-flex;font-size:18px;padding:4px 10px}
#sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:20px;background:var(--soft)}
#sync i{width:8px;height:8px;border-radius:50%;background:#9aa5ae;display:inline-block}
#sync.ok i{background:var(--ok)} #sync.busy i{background:var(--warn)} #sync.err i{background:var(--bad)}
main{padding:16px;max-width:1280px;width:100%;margin:0 auto;padding-bottom:90px}
#bnav{display:none}
@media (max-width:860px){
  #side{display:none}
  #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);text-decoration:none}
  #bnav a.on{color:var(--brand2);font-weight:600}
  main{padding:12px;padding-bottom:96px}
}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff} .btn.p:hover{background:var(--brand)}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{color:var(--bad)} .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px} .btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{font-size:14px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc7e3;border-color:var(--brand2)}
input:disabled,select:disabled,textarea:disabled{background:#f6f7f8;color:#58636d}
textarea{resize:vertical}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px 0 14px;scrollbar-width:none}
.tabs a{padding:9px 13px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--brand2);border-bottom-color:var(--brand2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips.blocks{position:sticky;top:var(--topH,52px);z-index:15;background:var(--bg);margin:0 -16px 10px;padding:10px 16px;border-bottom:1px solid var(--line);box-shadow:0 4px 8px -6px rgba(0,0,0,.15)}
@media (max-width:860px){.chips.blocks{margin:0 -12px 10px;padding:8px 12px}}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--soft)}
.list .it .t{font-weight:600} .list .it .m{font-size:12px;color:var(--muted)}
.list .it .grow{flex:1;min-width:0}
.amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;background:var(--soft);color:var(--muted)}
.badge.Draft{background:#eef1f4;color:#5b6773} .badge.Submitted{background:#e5f0fb;color:#1d5f99} .badge.Certified{background:#fff3df;color:#9a5b00} .badge.Paid{background:#e3f5ea;color:#1f7a45} .badge.Cancelled{background:#fbe9e7;color:#a8321f}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.t th{background:#f2f6f9;position:sticky;top:0;z-index:2;text-align:left;font-weight:600;font-size:12px;color:#3c4a56;white-space:nowrap}
table.t tr.grp td{background:#f7f7f7;font-weight:600}
table.t tr.sec td{background:#fff6dc;font-weight:700;font-style:italic}
table.t tr.tot td{background:#eaf2f8;font-weight:700}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input,table.t select{padding:5px 6px;border-radius:6px;font-size:13px}
table.t input.num{width:78px;text-align:right}
table.t .stick{position:sticky;left:0;background:#fff;z-index:1}
table.t th.stick{z-index:3;background:#f2f6f9}
table.t tr.neg td{color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px} .warnbox{background:#fff6e6;border:1px solid #f1d39f;color:#7a4b00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.okbox{background:#e9f6ef;border:1px solid #b7dfc6;color:#1f5f3a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.pct{position:relative}
.pct small{display:block;font-size:10px;color:var(--muted);text-align:right;line-height:1.1}
dialog{border:0;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,30,45,.45)}
dialog .dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
dialog .db{padding:16px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2730;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:100;pointer-events:none;max-width:90%}
#toast.on{opacity:.95}
.welcome{max-width:460px;margin:8vh auto;padding:0 16px}
.welcome .mark{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 12px;box-shadow:inset 0 -6px 0 var(--accent)}
.welcome h1{text-align:center;margin:0 0 4px;font-size:24px}
.inv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px}
.inv h3{text-align:center;margin:0 0 12px;letter-spacing:2px}
.inv .pp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:12px}
@media (max-width:700px){.inv .pp{grid-template-columns:1fr}}
.inv .pp div{white-space:pre-line}
.right{text-align:right}
.hide{display:none!important}
.fab{position:fixed;right:18px;bottom:84px;z-index:25;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:12px 18px}
@media (min-width:861px){.fab{bottom:24px}}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo"><div class="mark">A</div><div><b>Aarush Estimation</b><span>RAB billing &amp; measurement</span></div></div>
    <nav id="snav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div id="wrap">
    <header id="top">
      <button id="back" class="btn ghost sm" aria-label="Back">&#8592;</button>
      <h1 id="title">Aarush Estimation</h1>
      <div id="sync" title="Sync status"><i></i><span>Local</span></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav id="bnav"></nav>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgf"><div class="dh" id="dlgh"></div><div class="db" id="dlgb"></div><div class="df" id="dlgfoot"></div></form></dialog>

</body>
</html>
